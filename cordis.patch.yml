# DSH Plugin Vetter: Pre-install Security Audit & Interception Gate
# Registered as a host-authoritative Cordis plugin.
- insert:
    - id: dsh-plugin-vetter
      name: dsh-plugin-vetter
      config:
        # If true, blocks installation automatically when any CRITICAL finding is detected
        strictMode: true
        # Intercept any install requests
        scanOnInstall: true
        # Intercept any update requests
        scanOnUpdate: true
        # Enable persistent multi-dimensional local cache (model, version, plugin, hash)
        enableCache: true
        # Default audit model/engine ('agent-reviewer', 'gemini-3.8-flash', 'deepseek-chat', etc.)
        model: "agent-reviewer"
        # Allowed domains for plugins (official registries and standard APIs)
        allowedDomains:
          - "registry.npmjs.org"
          - "github.com"
          - "api.github.com"
          - "dsh-market.com"
        # Temporary staging time-to-live in ms (default 5 minutes)
        stagingTtlMs: 300000
